server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never
  compression:
    enabled: true

spring:
  application:
    name: flowcanvas-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowcanvas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      pool-name: flowcanvas-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

flowcanvas:
  ai:
    # mock  -> deterministic, offline provider (default, no credentials required)
    # openai -> any OpenAI-compatible /chat/completions endpoint
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-retries: ${AI_MAX_RETRIES:2}
    # Simulated latency per mock call, so live run progress is visible in the demo.
    mock-latency-ms: ${AI_MOCK_LATENCY_MS:600}
  execution:
    max-concurrent: ${EXECUTION_MAX_CONCURRENT:4}
    queue-capacity: ${EXECUTION_QUEUE_CAPACITY:64}
  seed:
    examples: ${SEED_EXAMPLES:true}

logging:
  level:
    root: INFO
    com.flowcanvas: ${LOG_LEVEL:INFO}
    org.springframework.jdbc.core: WARN
