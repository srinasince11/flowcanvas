<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Classic filter chain instead of feDropShadow: feDropShadow is an SVG 2
           primitive that several renderers (including librsvg, used to produce the
           PNG) silently drop, taking every filtered element with it. -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1440" height="980" fill="#f8fafc"/>

  <!-- Title -->
  <text x="48" y="54" font-size="26" font-weight="700" fill="#0f172a">FlowCanvas — System Architecture</text>
  <text x="48" y="80" font-size="14" fill="#64748b">React Flow client · Spring Boot API · PostgreSQL — a visual builder for AI workflows</text>

  <!-- ═══════════════════════ Browser layer ═══════════════════════ -->
  <rect x="48" y="104" width="1344" height="228" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="48" y="104" width="1344" height="34" rx="14" fill="#eef2ff"/>
  <rect x="48" y="124" width="1344" height="14" fill="#eef2ff"/>
  <circle cx="70" cy="121" r="6" fill="#6366f1"/>
  <text x="86" y="127" font-size="14" font-weight="700" fill="#3730a3">BROWSER</text>
  <text x="176" y="127" font-size="12.5" fill="#6366f1">React 18 · TypeScript · Vite · React Flow (MIT)</text>

  <g filter="url(#softShadow)">
    <rect x="76" y="158" width="290" height="148" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="76" y="158" width="290" height="4" rx="2" fill="#38bdf8"/>
    <text x="94" y="188" font-size="14.5" font-weight="650" fill="#0f172a">Workflow Library</text>
    <text x="94" y="210" font-size="12" fill="#64748b">Saved workflows · search</text>
    <text x="94" y="228" font-size="12" fill="#64748b">Built-in examples</text>
    <text x="94" y="246" font-size="12" fill="#64748b">Loading · empty · error states</text>
    <text x="94" y="280" font-size="11" fill="#94a3b8">WorkflowLibrary.tsx</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="390" y="158" width="290" height="148" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="390" y="158" width="290" height="4" rx="2" fill="#a78bfa"/>
    <text x="408" y="188" font-size="14.5" font-weight="650" fill="#0f172a">Canvas</text>
    <text x="408" y="210" font-size="12" fill="#64748b">React Flow surface</text>
    <text x="408" y="228" font-size="12" fill="#64748b">4 custom node types</text>
    <text x="408" y="246" font-size="12" fill="#64748b">Cycle highlighting · live status</text>
    <text x="408" y="280" font-size="11" fill="#94a3b8">Canvas.tsx · FlowNodes.tsx</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="704" y="158" width="290" height="148" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="704" y="158" width="290" height="4" rx="2" fill="#f472b6"/>
    <text x="722" y="188" font-size="14.5" font-weight="650" fill="#0f172a">Inspector &amp; Validation</text>
    <text x="722" y="210" font-size="12" fill="#64748b">Per-type node configuration</text>
    <text x="722" y="228" font-size="12" fill="#64748b">Errors and warnings</text>
    <text x="722" y="246" font-size="12" fill="#64748b">Root cause ordered first</text>
    <text x="722" y="280" font-size="11" fill="#94a3b8">Inspector.tsx · ValidationPanel.tsx</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1018" y="158" width="290" height="148" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="1018" y="158" width="290" height="4" rx="2" fill="#34d399"/>
    <text x="1036" y="188" font-size="14.5" font-weight="650" fill="#0f172a">Run Viewer</text>
    <text x="1036" y="210" font-size="12" fill="#64748b">Per-node status &amp; output</text>
    <text x="1036" y="228" font-size="12" fill="#64748b">Errors · execution duration</text>
    <text x="1036" y="246" font-size="12" fill="#64748b">Polls while a run is live</text>
    <text x="1036" y="280" font-size="11" fill="#94a3b8">RunPanel.tsx</text>
  </g>

  <!-- api/client.ts bar -->
  <rect x="76" y="318" width="1232" height="0" fill="none"/>
  <text x="76" y="350" font-size="11.5" fill="#94a3b8">api/client.ts — typed fetch wrapper</text>

  <!-- ═══════════════════════ API layer ═══════════════════════ -->
  <rect x="48" y="366" width="1344" height="352" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="48" y="366" width="1344" height="34" rx="14" fill="#eef2ff"/>
  <rect x="48" y="386" width="1344" height="14" fill="#eef2ff"/>
  <circle cx="70" cy="383" r="6" fill="#6366f1"/>
  <text x="86" y="389" font-size="14" font-weight="700" fill="#3730a3">SPRING BOOT API</text>
  <text x="232" y="389" font-size="12.5" fill="#6366f1">Java 21 · Spring Boot 3.5 · JPA/Hibernate · Flyway</text>

  <!-- Row 1: web layer -->
  <g filter="url(#softShadow)">
    <rect x="76" y="418" width="403" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="94" y="444" font-size="14" font-weight="650" fill="#0f172a">api/ — REST layer</text>
    <text x="94" y="466" font-size="12" fill="#64748b">WorkflowController · ExecutionController</text>
    <text x="94" y="486" font-size="12" fill="#64748b">RFC 7807 problem responses with stable error codes</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="503" y="418" width="403" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="521" y="444" font-size="14" font-weight="650" fill="#0f172a">service/ — orchestration</text>
    <text x="521" y="466" font-size="12" fill="#64748b">WorkflowService · ExecutionService · ExecutionRunner</text>
    <text x="521" y="486" font-size="12" fill="#64748b">Owns every transactional boundary</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="930" y="418" width="378" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="948" y="444" font-size="14" font-weight="650" fill="#0f172a">domain/ — persistence</text>
    <text x="948" y="466" font-size="12" fill="#64748b">JPA entities · Spring Data repositories</text>
    <text x="948" y="486" font-size="12" fill="#64748b">Flyway owns the schema; Hibernate only validates it</text>
  </g>

  <!-- Row 2: the pure core -->
  <g filter="url(#softShadow)">
    <rect x="76" y="528" width="620" height="164" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="94" y="554" font-size="14" font-weight="650" fill="#6d28d9">graph/ + engine/ — the pure core</text>
    <text x="94" y="576" font-size="12" fill="#7c3aed">No Spring state · no database · no HTTP — unit-testable in isolation</text>
    <rect x="94" y="590" width="278" height="86" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="110" y="612" font-size="12.5" font-weight="650" fill="#0f172a">GraphValidator</text>
    <text x="110" y="632" font-size="11.5" fill="#64748b">Arity rules · dangling edges</text>
    <text x="110" y="650" font-size="11.5" fill="#64748b">DFS cycle detection with the</text>
    <text x="110" y="666" font-size="11.5" fill="#64748b">exact cycle reported</text>
    <rect x="386" y="590" width="292" height="86" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="402" y="612" font-size="12.5" font-weight="650" fill="#0f172a">WorkflowEngine</text>
    <text x="402" y="632" font-size="11.5" fill="#64748b">Kahn topological sort (deterministic)</text>
    <text x="402" y="650" font-size="11.5" fill="#64748b">Per-node timing · failure isolation</text>
    <text x="402" y="666" font-size="11.5" fill="#64748b">descendants skipped, siblings continue</text>
  </g>

  <!-- AI provider -->
  <g filter="url(#softShadow)">
    <rect x="720" y="528" width="588" height="164" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="738" y="554" font-size="14" font-weight="650" fill="#047857">ai/ — the provider seam</text>
    <text x="738" y="576" font-size="12" fill="#059669">One interface, two implementations — swap backends without touching the engine</text>
    <rect x="738" y="590" width="270" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="754" y="612" font-size="12.5" font-weight="650" fill="#0f172a">MockAiProvider</text>
    <text x="754" y="632" font-size="11.5" fill="#64748b">Offline · deterministic · default</text>
    <text x="754" y="650" font-size="11.5" fill="#64748b">No credentials needed</text>
    <text x="754" y="666" font-size="11.5" fill="#64748b">Simulates failure and latency</text>
    <rect x="1022" y="590" width="268" height="86" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="1038" y="612" font-size="12.5" font-weight="650" fill="#0f172a">OpenAiCompatible</text>
    <text x="1038" y="632" font-size="11.5" fill="#64748b">Any /chat/completions endpoint</text>
    <text x="1038" y="650" font-size="11.5" fill="#64748b">Env-configured, never hardcoded</text>
    <text x="1038" y="666" font-size="11.5" fill="#64748b">OpenAI · Azure · Ollama · vLLM</text>
  </g>

  <!-- ═══════════════════════ Database layer ═══════════════════════ -->
  <rect x="48" y="742" width="1344" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="48" y="742" width="1344" height="34" rx="14" fill="#eef2ff"/>
  <rect x="48" y="762" width="1344" height="14" fill="#eef2ff"/>
  <circle cx="70" cy="759" r="6" fill="#6366f1"/>
  <text x="86" y="765" font-size="14" font-weight="700" fill="#3730a3">POSTGRESQL</text>
  <text x="216" y="765" font-size="12.5" fill="#6366f1">Flyway-managed schema · Hibernate runs with ddl-auto: validate</text>

  <g>
    <rect x="76" y="794" width="196" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="92" y="818" font-size="12.5" font-weight="650" fill="#0f172a">workflows</text>
    <text x="92" y="838" font-size="11" fill="#64748b">id · name · status</text>
    <text x="92" y="855" font-size="11" fill="#64748b">created_at · updated_at</text>
  </g>
  <g>
    <rect x="288" y="794" width="196" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="304" y="818" font-size="12.5" font-weight="650" fill="#0f172a">workflow_nodes</text>
    <text x="304" y="838" font-size="11" fill="#64748b">node_key · type · label</text>
    <text x="304" y="855" font-size="11" fill="#64748b">x · y · config jsonb</text>
  </g>
  <g>
    <rect x="500" y="794" width="196" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="516" y="818" font-size="12.5" font-weight="650" fill="#0f172a">workflow_edges</text>
    <text x="516" y="838" font-size="11" fill="#64748b">source_id → nodes</text>
    <text x="516" y="855" font-size="11" fill="#64748b">target_id → nodes</text>
  </g>
  <g>
    <rect x="712" y="794" width="222" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="728" y="818" font-size="12.5" font-weight="650" fill="#0f172a">workflow_executions</text>
    <text x="728" y="838" font-size="11" fill="#64748b">status · duration_ms</text>
    <text x="728" y="855" font-size="11" fill="#64748b">started_at · finished_at</text>
  </g>
  <g>
    <rect x="950" y="794" width="226" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="966" y="818" font-size="12.5" font-weight="650" fill="#0f172a">node_executions</text>
    <text x="966" y="838" font-size="11" fill="#64748b">sequence · status · output</text>
    <text x="966" y="855" font-size="11" fill="#64748b">error · duration_ms</text>
  </g>
  <g>
    <rect x="1192" y="794" width="166" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="1208" y="818" font-size="12.5" font-weight="650" fill="#0f172a">Constraints</text>
    <text x="1208" y="838" font-size="11" fill="#64748b">FK · CHECK · UNIQUE</text>
    <text x="1208" y="855" font-size="11" fill="#64748b">ON DELETE CASCADE</text>
  </g>

  <!-- ═══════════════════════ Arrows ═══════════════════════ -->
  <path d="M 720 332 L 720 362" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrowAccent)"/>
  <text x="734" y="352" font-size="11" fill="#6366f1">HTTP / JSON</text>

  <path d="M 720 694 L 720 738" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrowAccent)"/>
  <text x="734" y="720" font-size="11" fill="#6366f1">JDBC</text>

  <path d="M 960 610 L 1016 610" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="988" y="600" font-size="10.5" fill="#059669" text-anchor="middle">AiProvider</text>

  <path d="M 700 610 L 716 610" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="48" y="940" font-size="11.5" fill="#94a3b8">Solid arrows: runtime data flow.  The client never decides validity — it renders the server's verdict, and the server re-validates before every run.</text>
  <text x="48" y="960" font-size="11.5" fill="#94a3b8">Full rationale and trade-offs: docs/architecture.md · API contract: docs/api.md · schema: docs/database-schema.md</text>
</svg>
